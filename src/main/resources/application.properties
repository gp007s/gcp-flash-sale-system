# One JAR, two roles (same idea as the two halves of the architecture diagram):
#   api         (default) runs on the Compute Engine VMs: /api/user/**, /api/admin/**, /health
#   fulfilment  runs on Cloud Run: /pubsub/push, /order/fulfillment/**  (profile: fulfilment)
flashsale.role=api

# Cloud Run sets PORT. On the VM we use 8080.
server.port=${PORT:8080}

# === Protects /api/admin/**, /gcs/** and /pubsub/send. Send it as header X-Admin-Key.
# If this is empty those paths are locked for everybody.
flashsale.admin-key=${ADMIN_API_KEY:}

# === Pub/Sub (replaces SQS). Credentials: the VM / Cloud Run service account, no key files.
flashsale.pubsub.project=${GCP_PROJECT:gcp-flash-sale-project}
flashsale.pubsub.topic=${PUBSUB_TOPIC:orders}

# === Cloud Storage (replaces S3)
flashsale.gcs.bucket=${GCS_BUCKET:}
flashsale.notifications.topic=${NOTIFICATIONS_TOPIC:order-notifications}

# === Memorystore for Redis (replaces ElastiCache)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=5000ms

# === Cloud SQL for MySQL (replaces RDS). Only the fulfilment role uses it.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flashsale}
spring.datasource.username=${DB_USER:flashsale}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# The api role has no database, so switch the DB auto-configuration off.
# application-fulfilment.properties turns it back on.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration