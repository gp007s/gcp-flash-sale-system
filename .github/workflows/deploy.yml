name: Deploy Flash Sale System

on:
  push:
    branches: [main, add-notification-service]

env:
  PROJECT_ID: gcp-flash-sale-project
  REGION: us-east1
  CLOUD_RUN_SERVICE: flash-sale-fulfilment

jobs:
  # ── Job 1: Deploy API role to Compute Engine VM ───────────────────────────
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/568677222977/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'flash-sale-cicd@gcp-flash-sale-project.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install NumPy for faster IAP tunneling
        run: pip3 install --break-system-packages numpy

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.GCE_SSH_PRIVATE_KEY }}" > ~/.ssh/google_compute_engine
          chmod 600 ~/.ssh/google_compute_engine
          ssh-keygen -l -f ~/.ssh/google_compute_engine && echo "Key is valid" || echo "Key is INVALID"

      - name: Deploy to flash-sale-vm
        env:
          CLOUDSDK_PYTHON: python3
        run: |
          gcloud compute start-iap-tunnel flash-sale-vm 22 \
            --local-host-port=localhost:2200 \
            --zone=us-east1-b \
            --project=gcp-flash-sale-project &
          TUNNEL_PID=$!

          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 2200 2>/dev/null; then
              echo "Tunnel ready after ${i}s"
              break
            fi
            echo "Waiting for tunnel... ${i}s"
            sleep 1
          done
          nc -z 127.0.0.1 2200 || { echo "Tunnel never opened"; kill $TUNNEL_PID; exit 1; }

          SSH_OPTS="-i ~/.ssh/google_compute_engine -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2200"

          ssh $SSH_OPTS gp007s@127.0.0.1 'sudo pkill -f app.jar || true'
          scp $SSH_OPTS target/gcp-flash-sale-system-0.0.1.jar gp007s@127.0.0.1:~/app.jar
          ssh $SSH_OPTS gp007s@127.0.0.1 \
            'nohup /usr/bin/java -Dflashsale.role=api -Dflashsale.pubsub.project=gcp-flash-sale-project -Dflashsale.pubsub.topic=orders -Dflashsale.admin-key=flash-admin-2024 -DSPRING_PROFILES_ACTIVE=api -DREDIS_HOST=10.142.0.3 -DREDIS_PORT=6379 -jar ~/app.jar > ~/output.log 2>&1 & disown'

  # ── Job 2: Build and deploy fulfilment role to Cloud Run ──────────────────
  deploy-fulfilment:
    name: Deploy Fulfilment to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/568677222977/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'flash-sale-cicd@gcp-flash-sale-project.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flash-sale/fulfilment:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --platform managed \
            --service-account flash-sale-vm-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --set-env-vars "GCP_PROJECT=${{ env.PROJECT_ID }}" \
            --set-env-vars "SPRING_PROFILES_ACTIVE=fulfilment" \
            --set-env-vars "GCS_BUCKET=gcp-flash-sale-receipts" \
            --set-env-vars "NOTIFICATIONS_TOPIC=order-notifications" \
            --set-env-vars "PUBSUB_TOPIC=orders" \
            --set-env-vars "REDIS_SSL=false" \
            --update-secrets "REDIS_HOST=REDIS_HOST:latest" \
            --update-secrets "REDIS_PORT=REDIS_PORT:latest" \
            --update-secrets "REDIS_PASSWORD=REDIS_PASSWORD:latest" \
            --update-secrets "DB_URL=DB_URL:latest" \
            --update-secrets "DB_USER=DB_USER:latest" \
            --update-secrets "DB_PASSWORD=DB_PASSWORD:latest" \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --timeout 60

      - name: Wire Pub/Sub push subscription to Cloud Run
        run: |
          FULFILMENT_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')

          PUSH_ENDPOINT="${FULFILMENT_URL}/pubsub/push"
          SUB_NAME="orders-fulfilment-push"

          gcloud run services add-iam-policy-binding ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} \
            --member="serviceAccount:service-568677222977@gcp-sa-pubsub.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

          if gcloud pubsub subscriptions describe "$SUB_NAME" \
               --project=${{ env.PROJECT_ID }} > /dev/null 2>&1; then
            gcloud pubsub subscriptions modify-push-config "$SUB_NAME" \
              --push-endpoint="$PUSH_ENDPOINT" \
              --push-auth-service-account="flash-sale-vm-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
              --project=${{ env.PROJECT_ID }}
            echo "Updated push endpoint to $PUSH_ENDPOINT"
          else
            gcloud pubsub subscriptions create "$SUB_NAME" \
              --topic=orders \
              --push-endpoint="$PUSH_ENDPOINT" \
              --push-auth-service-account="flash-sale-vm-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
              --ack-deadline=60 \
              --project=${{ env.PROJECT_ID }}
            echo "Created push subscription $SUB_NAME -> $PUSH_ENDPOINT"
          fi