name: Deploy Flash Sale System

on:
  push:
    branches: [main, add-notification-service, deploy-vm-cicd]

env:
  PROJECT_ID: gcp-flash-sale-project
  REGION: us-east1
  ZONE: us-east1-b
  VM_NAME: flash-sale-vm-1
  VM_NAME_2: flash-sale-vm-2
  CLOUD_RUN_SERVICE: flash-sale-fulfilment

jobs:
  # ── Job 1: Deploy API role to Compute Engine VM ───────────────────────────
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/568677222977/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'flash-sale-cicd@gcp-flash-sale-project.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install NumPy for faster IAP tunneling
        run: pip3 install --break-system-packages numpy

      - name: Copy JAR to VM-1
        env:
          CLOUDSDK_PYTHON: python3
        run: |
          gcloud compute scp target/gcp-flash-sale-system-0.0.1.jar \
            ${{ env.VM_NAME }}:~/app.jar --zone=${{ env.ZONE }} --tunnel-through-iap

      - name: Copy JAR to VM-2
        env:
          CLOUDSDK_PYTHON: python3
        run: |
          gcloud compute scp target/gcp-flash-sale-system-0.0.1.jar \
            ${{ env.VM_NAME_2 }}:~/app.jar --zone=${{ env.ZONE }} --tunnel-through-iap

      - name: Ensure Java 17 is installed on VM-1
        env:
          CLOUDSDK_PYTHON: python3
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.ZONE }} --tunnel-through-iap --command='java -version 2>/dev/null || (sudo apt-get update -q && sudo apt-get install -y openjdk-17-jre-headless)'

      - name: Ensure Java 17 is installed on VM-2
        env:
          CLOUDSDK_PYTHON: python3
        run: |
          gcloud compute ssh ${{ env.VM_NAME_2 }} --zone=${{ env.ZONE }} --tunnel-through-iap --command='java -version 2>/dev/null || (sudo apt-get update -q && sudo apt-get install -y openjdk-17-jre-headless)'

      - name: Fetch secrets for VM restart
        run: |
          echo "REDIS_HOST=$(gcloud secrets versions access latest --secret=REDIS_HOST_MEMORYSTORE --project=${{ env.PROJECT_ID }})" >> $GITHUB_ENV
          echo "REDIS_PORT=$(gcloud secrets versions access latest --secret=REDIS_PORT_MEMORYSTORE --project=${{ env.PROJECT_ID }})" >> $GITHUB_ENV
          echo "ADMIN_KEY=$(gcloud secrets versions access latest --secret=ADMIN_API_KEY --project=${{ env.PROJECT_ID }})" >> $GITHUB_ENV

      - name: Restart the app on VM-1
        env:
          CLOUDSDK_PYTHON: python3
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.ZONE }} --tunnel-through-iap \
            --command="pkill -f app.jar || true; nohup java -Dspring.data.redis.host=$REDIS_HOST -Dspring.data.redis.port=$REDIS_PORT -DADMIN_API_KEY=$ADMIN_KEY -jar ~/app.jar > /tmp/output.log 2>&1 & disown"

      - name: Restart the app on VM-2
        env:
          CLOUDSDK_PYTHON: python3
        run: |
          gcloud compute ssh ${{ env.VM_NAME_2 }} --zone=${{ env.ZONE }} --tunnel-through-iap \
            --command="pkill -f app.jar || true; nohup java -Dspring.data.redis.host=$REDIS_HOST -Dspring.data.redis.port=$REDIS_PORT -DADMIN_API_KEY=$ADMIN_KEY -jar ~/app.jar > /tmp/output.log 2>&1 & disown"

  # ── Job 2: Build and deploy fulfilment role to Cloud Run ──────────────────
  deploy-fulfilment:
    name: Deploy Fulfilment to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/568677222977/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'flash-sale-cicd@gcp-flash-sale-project.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/flash-sale/fulfilment:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --platform managed \
            --service-account flash-sale-vm-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --set-env-vars "GCP_PROJECT=${{ env.PROJECT_ID }}" \
            --set-env-vars "SPRING_PROFILES_ACTIVE=fulfilment" \
            --set-env-vars "GCS_BUCKET=gcp-flash-sale-receipts" \
            --set-env-vars "NOTIFICATIONS_TOPIC=order-notifications" \
            --set-env-vars "PUBSUB_TOPIC=orders" \
            --set-env-vars "REDIS_SSL=false" \
            --update-secrets "REDIS_HOST=REDIS_HOST_MEMORYSTORE:latest" \
            --update-secrets "REDIS_PORT=REDIS_PORT_MEMORYSTORE:latest" \
            --update-secrets "DB_URL=CLOUDSQL_URL:latest" \
            --update-secrets "DB_USER=CLOUDSQL_USER:latest" \
            --update-secrets "DB_PASSWORD=CLOUDSQL_PASSWORD:latest" \
            --vpc-connector flash-sale-connector \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --timeout 60

      - name: Wire Pub/Sub push subscription to Cloud Run
        run: |
          FULFILMENT_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')

          PUSH_ENDPOINT="${FULFILMENT_URL}/pubsub/push"
          SUB_NAME="orders-fulfilment-push"

          gcloud run services add-iam-policy-binding ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} \
            --member="serviceAccount:service-568677222977@gcp-sa-pubsub.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

          if gcloud pubsub subscriptions describe "$SUB_NAME" \
               --project=${{ env.PROJECT_ID }} > /dev/null 2>&1; then
            gcloud pubsub subscriptions modify-push-config "$SUB_NAME" \
              --push-endpoint="$PUSH_ENDPOINT" \
              --push-auth-service-account="flash-sale-vm-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
              --project=${{ env.PROJECT_ID }}
            echo "Updated push endpoint to $PUSH_ENDPOINT"
          else
            gcloud pubsub subscriptions create "$SUB_NAME" \
              --topic=orders \
              --push-endpoint="$PUSH_ENDPOINT" \
              --push-auth-service-account="flash-sale-vm-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
              --ack-deadline=60 \
              --project=${{ env.PROJECT_ID }}
            echo "Created push subscription $SUB_NAME -> $PUSH_ENDPOINT"
          fi
