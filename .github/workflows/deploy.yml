name: Deploy to Compute Engine

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/568677222977/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'flash-sale-cicd@gcp-flash-sale-project.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install NumPy for faster IAP tunneling
        run: pip3 install --break-system-packages numpy

      - name: Copy JAR to VM
        env:
          CLOUDSDK_PYTHON: python3
        run: |
          gcloud compute scp target/gcp-flash-sale-system-0.0.1.jar \
            flash-sale-vm:~/app.jar --zone=us-east1-b --tunnel-through-iap

      - name: Restart the app
        env:
          CLOUDSDK_PYTHON: python3
        run: |
          gcloud compute ssh flash-sale-vm --zone=us-east1-b --tunnel-through-iap \
            --verbosity=debug \
            --ssh-flag="-v" \
            --command="
              pkill -f app.jar || true
              nohup java -jar app.jar > output.log 2>&1 &
            "